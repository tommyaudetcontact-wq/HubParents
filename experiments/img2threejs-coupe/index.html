an class="label" id="model-label">Le modèle apparaîtra ici dès le premier passage.</span></div></div><section id="tests" style="padding:12px 22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center"></section><div id="status">Modèle expérimental séparé du jeu · construction et tests en cours.</div><script>document.querySelector('#reference').onchange=e=>document.querySelector('#ref').src='reference-'+e.target.value+'.png';document.querySelector('#wide').onclick=()=>document.querySelector('.panels').classList.toggle('wide');let ready=false;setInterval(async()=>{try{const s=await fetch('stage.json',{cache:'no-store'}).then(r=>r.json());document.querySelector('#stage').textContent=s.message;if(s.ready&&!document.querySelector('canvas')){ready=true;location.reload();}}catch{}},3000);</script></html>
